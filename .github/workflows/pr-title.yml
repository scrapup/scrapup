name: pr-title

# Ensures the PR title is a valid Conventional Commit. With squash merge the PR
# title becomes the commit on main, which is what release-please parses to decide
# the next version. Keep this green to keep versioning correct. The job name
# `validate` is a required status check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — keep in sync with the project's Conventional Commits usage.
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
